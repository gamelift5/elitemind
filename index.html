    <script>
      // Intelligent Domain Redirection System (Redirects custom domain to free GitHub Pages/active hosting)
      (function() {
        var currentHost = window.location.hostname;
        
        // Define your free website domain here (e.g., your GitHub Pages URL)
        var FREE_WEBSITE_URL = "https://sameerchoudhary3690.github.io"; // Change this if your GitHub repo/username is different
        
        // If the user lands on the custom domain (www.elitemindapp.com), redirect them to your free active website
        if (currentHost === "www.elitemindapp.com" || currentHost === "elitemindapp.com") {
          window.location.replace(FREE_WEBSITE_URL + window.location.pathname + window.location.search);
        }
      })();
    </script>
